<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title> Inscription Nouveau Client - Méditerranée </title>
</head>
<body bgcolor="bleue">
	<header>
		<h1> Ajout d'un nouveau véhicule </h1>
	</header>
	<section>
	<form action="#" method="post">
        <table border="0" width="65%">
            <tr><td> <label for="Marque"> Marque :</label> </td>
		        <td> <input type="text" id="Marque" name="Marque"></td></tr>

		    <tr><td><label for="Immatriulation"> Immatriculation :</label> </td>           
		        <td><input type="text" id="Immatriculation" name="Immatriculation"></td></tr>
		    <tr><td><label for="Couleur"> Couleur :</label> </td>
		        <td><input type="text" id="couleur" name="couleur"></td></tr>
		    <tr><td><label for="date_imma"> Date d'immatriculation :</label> </td>
                <td><input type="date" id="date_imma" name="date_imma"><br> </td></tr>
            <tr><td><label for="kml"> Kilométrage: </label></td>
                <td><input type="number" id="kml" name="kml"> </td></tr>

            <tr><td><label for="occ"> Occasion </label> </td>
                <td><input type="radio" id="occ" name="etat" value="Occasion"></td>
            <tr><td><label for="neuf"> Neuf </label> </td>
                <td><input type="radio" id="neuf" name="etat" value="Neuf"></td></tr>



            <tr><td><label for="carburant"> Carburant :</label></td>
                    <td><select id="carburant" name="carburant">
                            <option value="Hybride"> Hybride </option>
                            <option value="Electrique"> Electrique </option>
                            <option value="Diesel"> Diesel </option>
                            <option value="Essence"> Essence </option>
                        </select></td></tr>

            <tr><td><label for="btv"> Boite de vitesse: </label></td>
                <td><input type="" id="btv" name="btv"> </td></tr>

            <tr><td><label for="nbp"> Nombres de portes: </label></td>
                <td><input type="number" id="nbp" name="nbp"> </td></tr>


            <tr><td><label for="tailleh"> taille en hauteur: </label></td>
                <td><input type="number" id="tailleh" name="tailleh"> </td></tr>


            <tr><td><label for="longeur"> longeur : </label></td>
                <td><input type="number" id="number" name="number"> </td></tr>
    </section>
        </table>
    <footer>
    	<p>&copy; 2026 Agence Méditerranée - Location de véhicules </p>
    	<a href="../index.html"> Aller à l'acceuil </a>
    </footer></table>     
 </body>

</body>
</html>
